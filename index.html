<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Clinic — CRM</title>
  <!-- Tema İLK BOYAMADAN ÖNCE uygulanmalı, yoksa yanlış temada bir kare
       görünüp "flaş" oluyor. Panellerle AYNI localStorage anahtarı: kullanıcı
       koyu temadaysa giriş ekranı da koyu açılır, girişten sonra tema
       değişmiş gibi olmaz. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <script src="i18n.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       GİRİŞ EKRANI — Liquid Glass
       Panellerdeki cam dilinin (liquid-glass.css / -dark.css) giriş ekranı
       karşılığı. Sınıf ve id adları DEĞİŞMEDİ — JS onlara bağlı.

       Cam efektinin şartı arkada kırılacak RENK olması: zemin canlı bir
       mesh gradient, slab yarı saydam. Marka altını (#c9a97f) korunuyor —
       soğuk mor/mavi camın üstünde sıcak altın kasıtlı bir kontrast.
       ═══════════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #c9a97f;
      --gold-soft: rgba(201, 169, 127, 0.28);
      --gold-dim:  rgba(201, 169, 127, 0.12);
      --ease:      cubic-bezier(.22, 1, .36, 1);
      --spring:    cubic-bezier(.34, 1.4, .56, 1);
      --slab-r:    30px;
    }

    /* ── Açık tema (varsayılan) ─────────────────────────────────────── */
    html[data-theme="light"] {
      --g-1: rgba(255, 255, 255, 0.54);
      --g-3: rgba(255, 255, 255, 0.58);
      --edge: rgba(255, 255, 255, 0.55);
      --edge-soft: rgba(255, 255, 255, 0.34);
      --sheen: inset 0 1px 0 0 rgba(255, 255, 255, 0.85),
               inset 0 0 0 1px rgba(255, 255, 255, 0.20);
      --sh: 0 8px 24px rgba(23, 43, 99, 0.10), 0 40px 90px -20px rgba(23, 43, 99, 0.32);
      --ink:   #12141a;
      --ink-2: #4b5364;
      --ink-3: #7c8496;
      --blur: 30px;
      --sat: 190%;
    }
    html[data-theme="dark"] {
      --g-1: rgba(255, 255, 255, 0.065);
      --g-3: rgba(255, 255, 255, 0.09);
      --edge: rgba(255, 255, 255, 0.17);
      --edge-soft: rgba(255, 255, 255, 0.10);
      --sheen: inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
               inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      --sh: 0 10px 30px rgba(0, 0, 0, 0.50), 0 48px 110px -24px rgba(0, 0, 0, 0.72);
      --ink:   #f2f5fa;
      --ink-2: #a9b4c8;
      --ink-3: #78849c;
      --blur: 30px;
      --sat: 175%;
    }

    /* ── Zemin: mesh gradient ───────────────────────────────────────── */
    html { height: 100%; }
    html[data-theme="light"] { background: #cfdcfa; }
    html[data-theme="dark"]  { background: #070b14; }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      color: var(--ink);
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overflow-x: hidden;
    }
    html[data-theme="light"] body {
      background-image:
        radial-gradient(1250px 900px at 6%   0%,  rgba(37, 99, 235, 0.55),  transparent 62%),
        radial-gradient(1050px 820px at 97%  4%,  rgba(139, 92, 246, 0.52), transparent 60%),
        radial-gradient(1150px 900px at 92% 70%,  rgba(13, 148, 136, 0.48), transparent 62%),
        radial-gradient(980px  820px at 2%   72%, rgba(79, 70, 229, 0.44),  transparent 60%),
        radial-gradient(900px  760px at 44%  36%, rgba(56, 189, 248, 0.34), transparent 64%),
        radial-gradient(760px  640px at 62%  98%, rgba(236, 72, 153, 0.18), transparent 62%),
        linear-gradient(158deg, #d3e1fb 0%, #d6d9fa 46%, #cfe9f2 100%);
    }
    html[data-theme="dark"] body {
      background-image:
        radial-gradient(1250px 900px at 6%   0%,  rgba(37, 99, 235, 0.30),  transparent 60%),
        radial-gradient(1050px 820px at 97%  4%,  rgba(139, 92, 246, 0.26), transparent 58%),
        radial-gradient(1150px 900px at 92% 70%,  rgba(13, 148, 136, 0.24), transparent 60%),
        radial-gradient(980px  820px at 2%   72%, rgba(79, 70, 229, 0.22),  transparent 58%),
        radial-gradient(900px  760px at 44%  36%, rgba(56, 189, 248, 0.14), transparent 62%),
        linear-gradient(158deg, #0a1020 0%, #080d1a 46%, #0a0f1e 100%);
    }

    /* ── Tam ekran bölme: solda fotoğraf, sağda cam form ─────────────
       Kutu/levha YOK — iki panel de ekranı kenardan kenara doldurur.
       Cam olan tek yüzey sağdaki form kartı (.right-inner). */
    .panel-left, .panel-right {
      position: relative;
      min-height: 100vh;
    }
    .panel-left {
      flex: 0 0 58vw;
      overflow: hidden;
      animation: photoIn 1.1s var(--ease) both;
    }
    .panel-right {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px clamp(24px, 3.4vw, 56px);
      overflow: hidden;
    }
    /* ── Işık küreleri: camın KIRACAĞI renk ───────────────────────────
       Liquid Glass'ın şartı arkada kırılacak bir şey olması. Kartın
       arkasında ağır ağır sürüklenen iki renk küresi var; blur onları
       yumuşatınca cam canlı görünüyor. */
    .panel-right::before, .panel-right::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(46px);
    }
    .panel-right::before {
      width: 46%; padding-bottom: 46%;
      top: 4%; right: -8%;
      background: radial-gradient(circle at 35% 35%, rgba(139, 92, 246, .50), rgba(139, 92, 246, 0) 70%);
      animation: orbA 17s var(--ease) infinite alternate;
    }
    .panel-right::after {
      width: 52%; padding-bottom: 52%;
      bottom: -6%; left: -10%;
      background: radial-gradient(circle at 60% 40%, rgba(56, 189, 248, .42), rgba(56, 189, 248, 0) 70%);
      animation: orbB 21s var(--ease) infinite alternate;
    }
    html[data-theme="dark"] .panel-right::before {
      background: radial-gradient(circle at 35% 35%, rgba(139, 92, 246, .42), rgba(139, 92, 246, 0) 70%);
    }
    html[data-theme="dark"] .panel-right::after {
      background: radial-gradient(circle at 60% 40%, rgba(13, 148, 136, .40), rgba(13, 148, 136, 0) 70%);
    }
    /* İlk kare GÖRÜNÜR durum olmalı — animasyon kapalıysa (reduced-motion
       ya da statik render) küreler yine doğru yerde durur. */
    @keyframes orbA {
      from { transform: none; }
      to   { transform: translate3d(-9%, 7%, 0) scale(1.14); }
    }
    @keyframes orbB {
      from { transform: none; }
      to   { transform: translate3d(11%, -8%, 0) scale(1.1); }
    }
    /* Fotoğraf ile sağ zemin arasında kılcal ışık kenarı */
    .panel-left::after {
      content: '';
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg,
        rgba(201,169,127,.55) 0%, rgba(255,255,255,.22) 45%, rgba(201,169,127,.40) 100%);
      z-index: 3;
    }

    @keyframes photoIn {
      from { opacity: 0; transform: scale(1.04); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Sol panel: fotoğraf ─────────────────────────────────────────── */
    .panel-left-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* Fotoğraf zemin paletiyle uyuşsun: hafif soğutma + doygunluk */
      filter: saturate(1.10) contrast(1.05);
      transform: scale(1.02);
    }
    .panel-left-fallback {
      display: none;
      position: absolute; inset: 0;
      background: linear-gradient(155deg, #1b2540 0%, #16233c 50%, #101a2e 100%);
    }
    /* Üstten mor/mavi duotone — fotoğrafı cam paletine bağlar */
    .panel-left-overlay {
      position: absolute; inset: 0;
      background:
        radial-gradient(120% 90% at 15% 10%, rgba(79, 70, 229, 0.16), transparent 62%),
        radial-gradient(110% 80% at 90% 20%, rgba(139, 92, 246, 0.13), transparent 64%),
        linear-gradient(180deg, rgba(8, 12, 24, 0.10) 0%, rgba(8, 12, 24, 0.00) 46%, rgba(8, 12, 24, 0.55) 100%);
    }
    /* Alt yazı bloğu için ekstra okunurluk katmanı */
    .panel-left-overlay-bottom {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 70%;
      background: linear-gradient(180deg, transparent 0%, rgba(6, 9, 18, 0.55) 45%, rgba(6, 9, 18, 0.92) 100%);
    }
    .panel-left-content {
      position: absolute;
      left: clamp(26px, 3vw, 44px);
      right: clamp(26px, 3vw, 44px);
      bottom: clamp(30px, 4vh, 48px);
      z-index: 2;
      animation: contentIn .9s var(--ease) .28s both;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .logo-hero {
      display: flex; align-items: baseline; gap: 3px;
      margin-bottom: 14px;
    }
    .logo-hero-natural {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(38px, 4.4vw, 56px);
      font-weight: 300;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.005em;
    }
    .logo-hero-natural em { font-style: italic; }
    .logo-hero-dot { color: var(--gold); }
    .logo-hero-clinic {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.05vw, 13px);
      font-weight: 500;
      letter-spacing: 0.30em;
      text-transform: lowercase;
      color: var(--gold);
      padding-bottom: 4px;
    }
    .tagline {
      font-size: 12.5px;
      line-height: 1.75;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.80);
      max-width: 42ch;
    }
    .tagline-dots {
      display: flex; gap: 7px; margin-top: 20px;
    }
    .tagline-dot {
      width: 26px; height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.22);
    }
    .tagline-dot:first-child { background: var(--gold); width: 40px; }

    /* ── Sağ panel: CAM form kartı ───────────────────────────────────
       Liquid Glass burada: yarı saydam yüzey + blur + saturate.
       saturate() şart, yoksa cam gri plastik gibi okunuyor. */
    .right-inner {
      position: relative;
      z-index: 1;                 /* ışık kürelerinin ÜSTÜNDE kalmalı */
      width: 100%;
      max-width: 408px;
      padding: clamp(32px, 3.4vw, 44px) clamp(26px, 2.8vw, 36px);
      border-radius: 30px;
      border: 1px solid var(--edge-soft);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      /* Sheen artık kartın kendi gölgesinde — ::before parlamaya ayrıldı */
      box-shadow: var(--sh), var(--sheen);
      animation: cardIn 1s var(--ease) .14s both;
    }
    /* Camın kalınlık hissi: üstten aşağı hafif açılan yüzey */
    html[data-theme="light"] .right-inner {
      background: linear-gradient(158deg, rgba(255,255,255,.66) 0%, rgba(255,255,255,.44) 58%, rgba(255,255,255,.52) 100%);
    }
    html[data-theme="dark"] .right-inner {
      background: linear-gradient(158deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.045) 58%, rgba(255,255,255,.07) 100%);
    }
    /* Sol üstten gelen ışık parlaması (specular) — camı düz yüzeyden
       kurtaran şey bu; köşeye vuran ışık ve çapraz bir tarama. */
    .right-inner::before {
      content: '';
      position: absolute; inset: 0;
      /* z-index:-1 ŞART: parlama METNİN ALTINDA kalmalı. Kart backdrop-filter
         yüzünden kendi yığın bağlamını kurduğu için -1 dışına taşmaz. */
      z-index: -1;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(70% 46% at 14% 0%, rgba(255,255,255,.34), rgba(255,255,255,0) 68%),
        linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 34%);
    }
    html[data-theme="dark"] .right-inner::before {
      background:
        radial-gradient(70% 46% at 14% 0%, rgba(255,255,255,.13), rgba(255,255,255,0) 68%),
        linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 34%);
    }
    /* Kartın üst kenarında ince altın çizgi: soğuk camda sıcak aksan */
    .right-inner::after {
      content: '';
      position: absolute; top: 0; left: 26px; right: 26px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        rgba(201,169,127,0) 0%, rgba(201,169,127,.85) 50%, rgba(201,169,127,0) 100%);
      pointer-events: none;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.975); }
      to   { opacity: 1; transform: none; }
    }

    /* Kart içeriği sırayla belirir — form kurulurken akıyormuş hissi.
       #alertBox'a DOKUNULMUYOR (kendi alertIn animasyonu var ve JS onu
       display ile açıyor). */
    .right-inner > .welcome-title,
    .right-inner > .welcome-sub,
    .right-inner form > .field-group,
    .right-inner form > .btn-login {
      animation: riseIn .7s var(--ease) both;
    }
    .right-inner > .welcome-title    { animation-delay: .30s; }
    .right-inner > .welcome-sub      { animation-delay: .36s; }
    .right-inner form > .field-group:nth-of-type(1) { animation-delay: .42s; }
    .right-inner form > .field-group:nth-of-type(2) { animation-delay: .48s; }
    .right-inner form > .btn-login   { animation-delay: .56s; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .logo-mini { display: none; }   /* slab'de sol panel logoyu zaten taşıyor */

    .welcome-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .welcome-sub {
      font-size: 12.5px;
      color: var(--ink-3);
      margin-bottom: 26px;
      font-weight: 400;
    }

    .field-group { margin-bottom: 15px; }
    .field-label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 7px;
    }
    .field-box { position: relative; display: flex; align-items: center; }
    .field-icon {
      position: absolute; left: 13px;
      display: flex; align-items: center;
      color: var(--ink-3);
      pointer-events: none;
      transition: color .18s var(--ease);
    }
    .field-input {
      width: 100%;
      padding: 14px 14px 14px 40px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--g-3);
      -webkit-backdrop-filter: blur(14px) saturate(170%);
      backdrop-filter: blur(14px) saturate(170%);
      border: 1px solid var(--edge-soft);
      border-radius: 15px;
      outline: none;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease),
                  background .2s var(--ease), transform .25s var(--spring);
    }
    /* Girdinin kendisi de küçük bir cam parça: üstten ışık, içeriden derinlik */
    html[data-theme="light"] .field-input {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 2px 5px rgba(23, 43, 99, 0.055);
    }
    html[data-theme="dark"] .field-input {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 2px 6px rgba(0,0,0,.28);
    }
    .field-input::placeholder { color: var(--ink-3); opacity: .75; }
    html[data-theme="light"] .field-box:hover .field-input { background: rgba(255, 255, 255, 0.74); }
    html[data-theme="dark"]  .field-box:hover .field-input { background: rgba(255, 255, 255, 0.13); }
    /* Odak: görünür altın halka — outline kaldırıldığı için ŞART.
       Halkaya hafif bir yükselme ve altın parıltı eşlik ediyor. */
    .field-input:focus {
      border-color: var(--gold);
      transform: translateY(-1px);
    }
    html[data-theme="light"] .field-input:focus {
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 0 0 4px var(--gold-dim),
                  0 8px 20px -8px rgba(201, 169, 127, .55),
                  inset 0 1px 0 rgba(255,255,255,.95);
    }
    html[data-theme="dark"] .field-input:focus {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px var(--gold-dim),
                  0 8px 22px -8px rgba(201, 169, 127, .40),
                  inset 0 1px 0 rgba(255,255,255,.16);
    }
    .field-box:focus-within .field-icon { color: var(--gold); }
    /* Odaklanan alanın etiketi de aksana geçsin */
    .field-group:focus-within .field-label { color: var(--gold); }
    .field-label { transition: color .2s var(--ease); }

    .pw-toggle {
      position: absolute; right: 8px;
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      border: none; border-radius: 9px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      transition: background .16s var(--ease), color .16s var(--ease);
    }
    .pw-toggle:hover { color: var(--ink); background: var(--gold-dim); }

    /* ── Giriş butonu ───────────────────────────────────────────────── */
    .btn-login {
      width: 100%;
      margin-top: 10px;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #2a1f10;
      background: linear-gradient(135deg, #e3caa2 0%, var(--gold) 52%, #b8955f 100%);
      border: none;
      border-radius: 15px;
      cursor: pointer;
      position: relative;
      overflow: hidden;          /* parlama taraması dışarı taşmasın */
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 22px -6px rgba(201, 169, 127, 0.60),
                  0 2px 6px -2px rgba(120, 90, 40, 0.30),
                  inset 0 1px 0 rgba(255, 255, 255, 0.50);
      transition: transform .18s var(--spring), box-shadow .22s var(--ease),
                  filter .18s var(--ease);
    }
    /* Üzerine gelince altın yüzeyde soldan sağa geçen ışık taraması */
    .btn-login::before {
      content: '';
      position: absolute; top: 0; bottom: 0; left: -60%;
      width: 45%;
      background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-18deg);
      transition: left .55s var(--ease);
      pointer-events: none;
    }
    .btn-login:hover::before { left: 115%; }
    .btn-login:disabled::before { display: none; }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -8px rgba(201, 169, 127, 0.78),
                  0 2px 6px -2px rgba(120, 90, 40, 0.30),
                  inset 0 1px 0 rgba(255, 255, 255, 0.60);
      filter: brightness(1.05);
    }
    .btn-login:active { transform: translateY(0) scale(0.99); }
    .btn-login:disabled {
      opacity: 0.6; cursor: not-allowed;
      transform: none; filter: none;
    }
    .btn-login:focus-visible { box-shadow: 0 0 0 4px var(--gold-dim); }

    /* Alt bilgi alanı (varsa) */
    .divider-line {
      height: 1px; margin: 22px 0 16px;
      background: var(--edge-soft);
    }
    .admin-area { text-align: center; }
    .admin-label {
      font-size: 9px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-3);
      margin-bottom: 8px;
    }
    .admin-chip {
      display: inline-block;
      padding: 5px 12px; border-radius: 9999px;
      font-size: 10.5px; font-weight: 700;
      color: var(--ink-2);
      background: var(--g-3);
      border: 1px solid var(--edge-soft);
    }

    /* ── Hata uyarısı ───────────────────────────────────────────────── */
    #alertBox {
      display: none;
      margin-bottom: 16px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.30);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      animation: alertIn .3s var(--spring) both;
    }
    html[data-theme="light"] #alertBox { color: #b91c1c; }
    html[data-theme="dark"]  #alertBox { color: #fca5a5; }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Başarı bildirimi (sağ alt) ─────────────────────────────────── */
    #loginToast {
      position: fixed;
      bottom: 32px; right: 32px;
      z-index: 9999;
      width: 320px;
      padding: 20px 20px 18px;
      border-radius: 20px;
      border: 1px solid var(--edge-soft);
      background: var(--g-1);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      box-shadow: var(--sh), var(--sheen);
      display: flex; gap: 14px; align-items: flex-start;
      transform: translateX(calc(100% + 48px));
      opacity: 0;
      transition: transform 0.45s var(--ease), opacity 0.35s ease;
      pointer-events: none;
      overflow: hidden;
    }
    #loginToast.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .toast-icon-wrap {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 11px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .toast-body { min-width: 0; }
    .toast-label {
      font-size: 9px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 4px;
    }
    .toast-name {
      font-size: 14px; font-weight: 700; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
    /* DİKKAT: JS bu çubuğa 'toast-drain' animasyonunu atıyor
       (showToast → progress.style.animation). Animasyon scaleX ile
       çalıştığı için genişlik %100 ve transform-origin sol OLMAK ZORUNDA —
       width:0 bıraksaydım çubuk hiç görünmezdi. */
    .toast-progress {
      position: absolute; left: 0; bottom: 0; height: 2px;
      width: 100%;
      transform-origin: left;
      animation: none;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(90deg, var(--gold), #e3caa2);
    }
    @keyframes toast-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* ── Buton içi bekleme göstergesi ───────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(42, 31, 16, 0.3);
      border-top-color: #2a1f10;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Dar ekran: tek kolon, fotoğraf üstte ───────────────────────── */
    @media (max-width: 900px) {
      body { flex-direction: column; align-items: stretch; }
      .panel-left, .panel-right { flex: none; min-height: 0; }
      .panel-left { height: 34vh; min-height: 210px; }
      .panel-right { padding: 26px 18px 34px; }
      .panel-left::after {
        top: auto; left: 0; right: 0; bottom: 0;
        width: auto; height: 1px;
        background: linear-gradient(90deg,
          rgba(201,169,127,.20) 0%, rgba(201,169,127,.60) 50%, rgba(201,169,127,.20) 100%);
      }
      .logo-hero-natural { font-size: 38px; }
      .welcome-title { font-size: 29px; }
    }
    @media (max-width: 560px) {
      #loginToast { left: 16px; right: 16px; width: auto; bottom: 16px; }
    }

    /* ── Hareket azaltma tercihi ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001s !important;
        transition-duration: .001s !important;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       DİL + TEMA ANAHTARI (sağ üst, cam pill)
       Dil nc_lang'a, tema nc_theme'e yazılır — panellerle AYNI anahtarlar,
       yani burada TR seçilirse panel de Türkçe açılır.
       ═══════════════════════════════════════════════════════════════════ */
    .lg-switch {
      position: fixed;
      top: clamp(16px, 2.2vh, 26px);
      right: clamp(16px, 2vw, 28px);
      z-index: 50;
      display: flex; align-items: center; gap: 8px;
      animation: swIn .8s var(--ease) .5s both;
    }
    @keyframes swIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    .lg-pill {
      display: flex; align-items: center; gap: 2px;
      padding: 3px;
      border-radius: 9999px;
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      backdrop-filter: blur(24px) saturate(190%);
    }
    html[data-theme="light"] .lg-pill {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid var(--edge-soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 6px 18px -6px rgba(10,16,40,.30);
    }
    html[data-theme="dark"] .lg-pill {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--edge-soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 20px -6px rgba(0,0,0,.6);
    }
    .lg-pill button {
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 10.5px; font-weight: 800;
      letter-spacing: .06em;
      color: var(--ink-3);
      padding: 6px 13px;
      border-radius: 9999px;
      transition: background .2s var(--ease), color .2s var(--ease), transform .25s var(--spring);
    }
    .lg-pill button:hover { color: var(--ink); }
    .lg-pill button:active { transform: scale(.94); }
    .lg-pill button.on {
      color: #2a1f10;
      background: linear-gradient(135deg, #e3caa2, var(--gold));
      box-shadow: 0 3px 10px -2px rgba(201,169,127,.6), inset 0 1px 0 rgba(255,255,255,.45);
    }

    .lg-icon-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 9999px;
      cursor: pointer;
      color: var(--ink-2);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      backdrop-filter: blur(24px) saturate(190%);
      transition: color .2s var(--ease), transform .25s var(--spring), background .2s var(--ease);
    }
    html[data-theme="light"] .lg-icon-btn {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid var(--edge-soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 6px 18px -6px rgba(10,16,40,.30);
    }
    html[data-theme="dark"] .lg-icon-btn {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--edge-soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 20px -6px rgba(0,0,0,.6);
    }
    .lg-icon-btn:hover { color: var(--gold); transform: translateY(-1px); }
    .lg-icon-btn:active { transform: scale(.92); }
    .lg-icon-btn .ic-sun  { display: none; }
    .lg-icon-btn .ic-moon { display: block; }
    html[data-theme="dark"] .lg-icon-btn .ic-sun  { display: block; }
    html[data-theme="dark"] .lg-icon-btn .ic-moon { display: none; }

    /* Anahtar sağ üstte; dar ekranda slab'in üstüne binmesin */
    @media (max-width: 900px) {
      .lg-switch { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>

  <!-- ════ Dil + tema anahtarı ════
       Dil, panellerle AYNI localStorage anahtarına (nc_lang) yazılır:
       burada TR seçilirse panel de Türkçe açılır. Tema de aynı şekilde

  <!-- ════ LEFT: Building Photo ════ -->
  <div class="panel-left">
    <img
      class="panel-left-img"
      src="loginimage.png"
      alt="Natural Clinic Istanbul"
      onerror="this.style.display='none'; document.querySelector('.panel-left-fallback').style.display='block';"
    >
    <div class="panel-left-fallback"></div>

        <div class="tagline-dot"></div>
        <div class="tagline-dot"></div>

  <!-- ════ RIGHT: Login Form ════ -->
  <div class="panel-right">
    <div class="right-inner">

      <h2 class="welcome-title">Welcome back</h2>
      <p class="welcome-sub">Sign in to access your dashboard</p>

      <form id="loginForm" onsubmit="return false;">

        <!-- Alert -->
        <div id="alertBox"></div>

        <!-- Username -->
        <div class="field-group">
          <label class="field-label">Username</label>
          <div class="field-box">
            <span class="field-icon">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>

        <div class="field-group">

          <div class="field-box">
            <span class="field-icon">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="passwordInput" class="field-input" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
            <button type="button" class="pw-toggle" id="eyeBtn" onclick="togglePassword()" tabindex="-1" title="Şifreyi göster / gizle">
              <svg id="eyeOpen" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eyeClosed" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>

  <!-- Success Toast -->
  <div id="loginToast">
    <div class="toast-icon-wrap">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#c9a97f" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <div class="toast-body">
      <div class="toast-label">Giriş Başarılı</div>
      <div class="toast-name" id="toastName">—</div>
      <div class="toast-sub">Dashboard'a yönlendiriliyorsunuz…</div>
    </div>
    <div class="toast-progress" id="toastProgress"></div>
  </div>

  <script>
    // Password toggle
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const eyeOpen   = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        input.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    const alertBox    = document.getElementById('alertBox');
    const loginBtn    = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    function showAlert(message, type) {
      if (type === 'success') {
        showToast(message);
        return;
      }
      alertBox.style.display = 'block';
      alertBox.innerText = message;
    }

    function showToast(fullName) {
      const toast    = document.getElementById('loginToast');
      const nameEl   = document.getElementById('toastName');
      const progress = document.getElementById('toastProgress');
      nameEl.textContent = fullName;
      toast.classList.add('show');
      progress.style.animation = 'toast-drain 0.6s linear forwards';
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        loginBtnText.innerHTML = '<span class="spinner"></span>&nbsp;Checking...';
      } else {
        loginBtnText.innerText = 'Sign In';
      }
    }

    async function handleLogin() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!username) { showAlert('Please enter your username.', 'error'); return; }
      if (!password) { showAlert('Please enter your password.', 'error'); return; }

      setLoading(true);

      try {
        // Kimlik doğrulama artık tarayıcıda değil, sunucuda (api/login.js,
        // service_role key ile) yapılıyor — tarayıcı Users tablosuna hiç
        // dokunmuyor, Password alanı istemciye asla gönderilmiyor. Önceden
        // burada sabit kodlu bir "admin/admin123" arka kapı şifresi vardı,
        // güvenlik açığı olduğu için kaldırıldı.
        const loginResp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const loginData = await loginResp.json().catch(() => ({}));
        if (!loginResp.ok) {
          showAlert(loginData.error || 'Login failed.', 'error');
          setLoading(false); return;
        }

        const user = loginData.user;

        const _c = await fetch('/api/config').then(r => r.json());
        const SUPABASE_URL = _c.url;
        const SUPABASE_KEY = _c.key;

        let rawRole = String(user['Role'] || 'agent').toLowerCase().trim();
        let role = 'agent';
        if (rawRole.includes('super'))                                          role = 'super-admin';
        else if (rawRole.includes('admin'))                                     role = 'admin';
        else if (rawRole.includes('regional') || rawRole.includes('manager') || rawRole.includes('rm')) role = 'regional-manager';
        else if (rawRole.includes('leader') || rawRole.includes('tl'))          role = 'team-leader';

        const sessionUser = {
          fullName: user['Deal Owner Name'] || username,
          username: user['Username'] || username,
          role: role,
          team: user['Takim Adi'] || user['Role Name'] || '',
          id: user['Id'] || user['id'] || '',
          zoho_id: user['Id'] || '',
          // admin/super-admin girişlerinde api/login.js'in ürettiği imzalı
          // token — admin.html'in Users sayfası (api/admin-users.js) bunu
          // Authorization başlığında gönderir, aksi halde 401 alır.
          token: user['token'] || ''
        };

        sessionStorage.setItem('nc_current_user', JSON.stringify(sessionUser));
        showToast(sessionUser.fullName);

        try {
          // NOT: Önceden var olmayan bir "System_Logs" tablosuna yazıyordu —
          // istek sessizce 404 alıp yutulduğu için login kayıtları hiç
          // tutulmamıştı. Panellerin addLog()'unun kullandığı gerçek tablo
          // "Logs"; aynı alan şemasıyla oraya yazıyor.
          fetch(`${SUPABASE_URL}/rest/v1/Logs`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json; charset=utf-8', 'Prefer': 'return=minimal' },
            body: JSON.stringify({ username: sessionUser.username, full_name: sessionUser.fullName || sessionUser.username, role: sessionUser.role, team: sessionUser.team, page: 'login', action_type: 'LOGIN', details: `${sessionUser.fullName} logged in` })
          }).catch(() => {});
        } catch(e) {}

        setTimeout(() => {
          // Login sonrası doğrudan panele değil, uygulama seçim ekranına
          // (apps.html) gidiyor — kullanıcı orada Natural Clinic'e ait
          // hangi sisteme gireceğini seçiyor.
          if (['agent','team-leader','admin','super-admin','regional-manager'].includes(role)) window.location.href = 'apps.html';
          else showAlert(`Role "${role}" is not authorized.`, 'error');
        }, 600);

      } catch (err) {
        console.error('Login error:', err);
        showAlert('Connection error: ' + (err.message || 'Unknown error'), 'error');
        setLoading(false);
      }
    }

    // Aynı sekmede zaten giriş yapılmış mı? (sessionStorage sekmeye özel —
    // yeni sekme/gizli sekmede boş gelir, her zaman login ister)
    try {
      const existing = JSON.parse(sessionStorage.getItem('nc_current_user') || 'null');
      if (existing && existing.role) {
        window.location.href = 'apps.html';
      }
    } catch(e) { sessionStorage.removeItem('nc_current_user'); }

    // Eski/geçersiz token yüzünden bir sayfa oturumu otomatik sonlandırıp
    // buraya geri gönderdiyse, kullanıcıya nedenini açıkla.
    if (new URLSearchParams(window.location.search).get('relogin') === '1') {
      showAlert('Your session has expired. Please sign in again.', 'error');
    }
  </script>

  <script>
    /* ════ Giriş ekranı dil + tema anahtarı ════
       Bu ekranın metinleri İngilizce yazılmış; i18n.js sözlüğü ise TR→EN
       yönünde çalışıyor, yani bu metinleri çeviremez. Bu yüzden ekranın
       kendi küçük sözlüğü burada duruyor.

       Giriş MANTIĞINA dokunulmadı: showAlert ve setLoading sarmalanıyor
       (orijinali çağrılıp yalnızca GÖRÜNEN metin diline uyarlanıyor). */

    var LOGIN_TXT = {
      title:    { tr: 'Tekrar hoş geldiniz',                   en: 'Welcome back' },
      sub:      { tr: 'Panelinize erişmek için giriş yapın',    en: 'Sign in to access your dashboard' },
      user:     { tr: 'Kullanıcı Adı',                          en: 'Username' },
      pass:     { tr: 'Şifre',                                  en: 'Password' },
      userPh:   { tr: 'Kullanıcı adı',                          en: 'Username' },
      signIn:   { tr: 'Giriş Yap',                              en: 'Sign In' },
      checking: { tr: 'Kontrol ediliyor...',                    en: 'Checking...' },
      pwTitle:  { tr: 'Şifreyi göster / gizle',                 en: 'Show / hide password' },
      tLabel:   { tr: 'Giriş Başarılı',                         en: 'Signed in' },
      tSub:     { tr: 'Panele yönlendiriliyorsunuz…',           en: 'Redirecting to your dashboard…' }
    };

    // showAlert'e gelen İngilizce metinlerin Türkçe karşılıkları. Listede
    // olmayan bir metin (ör. sunucudan gelen hata) OLDUĞU GİBİ geçer.
    var LOGIN_ALERTS = {
      'Please enter your username.': 'Lütfen kullanıcı adınızı girin.',
      'Please enter your password.': 'Lütfen şifrenizi girin.',
      'Login failed.': 'Giriş başarısız.',
      'Your session has expired. Please sign in again.': 'Oturumunuz sona erdi. Lütfen tekrar giriş yapın.',
      'Connection error: ': 'Bağlantı hatası: '
    };

    function loginLang() {
      try { return localStorage.getItem('nc_lang') === 'en' ? 'en' : 'tr'; }
      catch (e) { return 'tr'; }
    }
    function LT(key) {
      var e = LOGIN_TXT[key];
      return e ? (e[loginLang()] || e.en) : '';
    }

    function applyLoginLang() {
      var L = loginLang();
      document.documentElement.setAttribute('lang', L);

      var t = document.querySelector('.welcome-title'); if (t) t.textContent = LT('title');
      var s = document.querySelector('.welcome-sub');   if (s) s.textContent = LT('sub');

      var labels = document.querySelectorAll('.field-label');
      if (labels[0]) labels[0].textContent = LT('user');
      if (labels[1]) labels[1].textContent = LT('pass');

      var u = document.getElementById('usernameInput');
      if (u) u.setAttribute('placeholder', LT('userPh'));

      var eye = document.getElementById('eyeBtn');
      if (eye) eye.setAttribute('title', LT('pwTitle'));

      // Buton yükleme sırasında spinner taşıyor — o an metnini EZMEYELIM.
      var btn = document.getElementById('loginBtn');
      var bt  = document.getElementById('loginBtnText');
      if (bt && !(btn && btn.disabled)) bt.textContent = LT('signIn');

      var tl = document.querySelector('.toast-label'); if (tl) tl.textContent = LT('tLabel');
      var ts = document.querySelector('.toast-sub');   if (ts) ts.textContent = LT('tSub');

      var tr = document.getElementById('langBtnTR'), en = document.getElementById('langBtnEN');
      if (tr) tr.classList.toggle('on', L === 'tr');
      if (en) en.classList.toggle('on', L === 'en');
    }

    function setLoginLang(lang) {
      if (lang !== 'tr' && lang !== 'en') return;
      try { localStorage.setItem('nc_lang', lang); } catch (e) {}
      applyLoginLang();
    }

    function toggleLoginTheme() {
      var cur  = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('nc_theme', next); } catch (e) {}
      document.documentElement.setAttribute('data-theme', next);
    }

    // ── Mevcut fonksiyonları sarmala (içlerine dokunmadan) ──────────────
    (function () {
      var _showAlert = window.showAlert;
      if (typeof _showAlert === 'function') {
        window.showAlert = function (message, type) {
          var m = String(message == null ? '' : message);
          if (loginLang() === 'tr') {
            if (LOGIN_ALERTS[m]) m = LOGIN_ALERTS[m];
            else {
              // "Connection error: ..." gibi ÖNEKLİ mesajlar
              for (var k in LOGIN_ALERTS) {
                if (k.slice(-2) === ': ' && m.indexOf(k) === 0) {
                  m = LOGIN_ALERTS[k] + m.slice(k.length);
                  break;
                }
              }
            }
          }
          return _showAlert(m, type);
        };
      }

      var _setLoading = window.setLoading;
      if (typeof _setLoading === 'function') {
        window.setLoading = function (loading) {
          var r = _setLoading(loading);
          var bt = document.getElementById('loginBtnText');
          if (bt) {
            if (loading) bt.innerHTML = '<span class="spinner"></span>&nbsp;' + LT('checking');
            else bt.textContent = LT('signIn');
          }
          return r;
        };
      }
    })();

    applyLoginLang();
  </script>
</body>
</html>
