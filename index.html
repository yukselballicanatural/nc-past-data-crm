<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natural Clinic — CRM</title>
  <!-- Tema İLK BOYAMADAN ÖNCE uygulanmalı, yoksa yanlış temada bir kare
       görünüp "flaş" oluyor. Panellerle AYNI localStorage anahtarı: kullanıcı
       koyu temadaysa giriş ekranı da koyu açılır, girişten sonra tema
       değişmiş gibi olmaz. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nc_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  <script src="i18n.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       GİRİŞ EKRANI — Liquid Glass
       Panellerdeki cam dilinin (liquid-glass.css / -dark.css) giriş ekranı
       karşılığı. Sınıf ve id adları DEĞİŞMEDİ — JS onlara bağlı.

       Cam efektinin şartı arkada kırılacak RENK olması: zemin canlı bir
       mesh gradient, slab yarı saydam. Marka altını (#c9a97f) korunuyor —
       soğuk mor/mavi camın üstünde sıcak altın kasıtlı bir kontrast.
       ═══════════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #c9a97f;
      --gold-soft: rgba(201, 169, 127, 0.28);
      --gold-dim:  rgba(201, 169, 127, 0.12);
      --ease:      cubic-bezier(.22, 1, .36, 1);
      --spring:    cubic-bezier(.34, 1.4, .56, 1);
      --slab-r:    30px;
    }

    /* ── Açık tema (varsayılan) ─────────────────────────────────────── */
    html[data-theme="light"] {
      --g-1: rgba(255, 255, 255, 0.54);
      --g-3: rgba(255, 255, 255, 0.58);
      --edge: rgba(255, 255, 255, 0.55);
      --edge-soft: rgba(255, 255, 255, 0.34);
      --sheen: inset 0 1px 0 0 rgba(255, 255, 255, 0.85),
               inset 0 0 0 1px rgba(255, 255, 255, 0.20);
      --sh: 0 8px 24px rgba(23, 43, 99, 0.10), 0 40px 90px -20px rgba(23, 43, 99, 0.32);
      --ink:   #12141a;
      --ink-2: #4b5364;
      --ink-3: #7c8496;
      --blur: 30px;
      --sat: 190%;
    }
    html[data-theme="dark"] {
      --g-1: rgba(255, 255, 255, 0.065);
      --g-3: rgba(255, 255, 255, 0.09);
      --edge: rgba(255, 255, 255, 0.17);
      --edge-soft: rgba(255, 255, 255, 0.10);
      --sheen: inset 0 1px 0 0 rgba(255, 255, 255, 0.14),
               inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      --sh: 0 10px 30px rgba(0, 0, 0, 0.50), 0 48px 110px -24px rgba(0, 0, 0, 0.72);
      --ink:   #f2f5fa;
      --ink-2: #a9b4c8;
      --ink-3: #78849c;
      --blur: 30px;
      --sat: 175%;
    }

    /* ── Zemin: mesh gradient ───────────────────────────────────────── */
    html { height: 100%; }
    html[data-theme="light"] { background: #cfdcfa; }
    html[data-theme="dark"]  { background: #070b14; }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      color: var(--ink);
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overflow-x: hidden;
    }
    html[data-theme="light"] body {
      background-image:
        radial-gradient(1250px 900px at 6%   0%,  rgba(37, 99, 235, 0.55),  transparent 62%),
        radial-gradient(1050px 820px at 97%  4%,  rgba(139, 92, 246, 0.52), transparent 60%),
        radial-gradient(1150px 900px at 92% 70%,  rgba(13, 148, 136, 0.48), transparent 62%),
        radial-gradient(980px  820px at 2%   72%, rgba(79, 70, 229, 0.44),  transparent 60%),
        radial-gradient(900px  760px at 44%  36%, rgba(56, 189, 248, 0.34), transparent 64%),
        radial-gradient(760px  640px at 62%  98%, rgba(236, 72, 153, 0.18), transparent 62%),
        linear-gradient(158deg, #d3e1fb 0%, #d6d9fa 46%, #cfe9f2 100%);
    }
    html[data-theme="dark"] body {
      background-image:
        radial-gradient(1250px 900px at 6%   0%,  rgba(37, 99, 235, 0.30),  transparent 60%),
        radial-gradient(1050px 820px at 97%  4%,  rgba(139, 92, 246, 0.26), transparent 58%),
        radial-gradient(1150px 900px at 92% 70%,  rgba(13, 148, 136, 0.24), transparent 60%),
        radial-gradient(980px  820px at 2%   72%, rgba(79, 70, 229, 0.22),  transparent 58%),
        radial-gradient(900px  760px at 44%  36%, rgba(56, 189, 248, 0.14), transparent 62%),
        linear-gradient(158deg, #0a1020 0%, #080d1a 46%, #0a0f1e 100%);
    }

    /* ── Slab: iki panel BİRLİKTE tek bir cam levha ──────────────────
       Ortak kap yok (HTML'e eleman eklemiyoruz), o yüzden iki panel
       kendi köşelerini yuvarlayıp yan yana tek levha gibi duruyor. */
    .panel-left, .panel-right {
      position: relative;
      height: min(600px, calc(100vh - 52px));
      box-shadow: var(--sh);
      animation: slabIn 0.9s var(--ease) both;
    }
    .panel-left {
      flex: 0 0 clamp(320px, 42vw, 520px);
      border-radius: var(--slab-r) 0 0 var(--slab-r);
      overflow: hidden;
      border: 1px solid var(--edge-soft);
      border-right: none;
    }
    .panel-right {
      flex: 0 1 clamp(360px, 34vw, 470px);
      border-radius: 0 var(--slab-r) var(--slab-r) 0;
      border: 1px solid var(--edge-soft);
      border-left: none;
      background: var(--g-1);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px clamp(28px, 3.4vw, 46px);
      animation-delay: .06s;
    }
    /* Sheen ve iki panel arasındaki kılcal ayırıcı */
    .panel-right::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      box-shadow: var(--sheen);
      pointer-events: none;
    }
    .panel-left::after {
      content: '';
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 1px;
      background: var(--edge-soft);
      z-index: 3;
    }
    /* Slab'in ÜST kenarında ince altın çizgi: soğuk camda sıcak bir aksan.
       İki panele ayrı ayrı veriliyor çünkü ortak bir kap yok (HTML'e eleman
       eklemiyoruz); ikisi birleşince tek bir çizgi olarak okunuyor. */
    .panel-left::before, .panel-right::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      z-index: 4;
      pointer-events: none;
    }
    .panel-left::before {
      background: linear-gradient(90deg, rgba(201,169,127,0) 0%, rgba(201,169,127,.55) 60%, rgba(201,169,127,.8) 100%);
      border-top-left-radius: var(--slab-r);
    }
    .panel-right::after {
      background: linear-gradient(90deg, rgba(201,169,127,.8) 0%, rgba(201,169,127,.45) 55%, rgba(201,169,127,0) 100%);
      border-top-right-radius: var(--slab-r);
    }

    @keyframes slabIn {
      from { opacity: 0; transform: translateY(22px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Sol panel: fotoğraf ─────────────────────────────────────────── */
    .panel-left-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* Fotoğraf zemin paletiyle uyuşsun: hafif soğutma + doygunluk */
      filter: saturate(1.05) contrast(1.03);
      transform: scale(1.02);
    }
    .panel-left-fallback {
      display: none;
      position: absolute; inset: 0;
      background: linear-gradient(155deg, #1b2540 0%, #16233c 50%, #101a2e 100%);
    }
    /* Üstten mor/mavi duotone — fotoğrafı cam paletine bağlar */
    .panel-left-overlay {
      position: absolute; inset: 0;
      background:
        radial-gradient(120% 90% at 15% 10%, rgba(79, 70, 229, 0.42), transparent 60%),
        radial-gradient(110% 80% at 90% 20%, rgba(139, 92, 246, 0.34), transparent 62%),
        linear-gradient(180deg, rgba(8, 12, 24, 0.30) 0%, rgba(8, 12, 24, 0.10) 42%, rgba(8, 12, 24, 0.72) 100%);
    }
    /* Alt yazı bloğu için ekstra okunurluk katmanı */
    .panel-left-overlay-bottom {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 70%;
      background: linear-gradient(180deg, transparent 0%, rgba(6, 9, 18, 0.55) 45%, rgba(6, 9, 18, 0.92) 100%);
    }
    .panel-left-content {
      position: absolute;
      left: clamp(26px, 3vw, 44px);
      right: clamp(26px, 3vw, 44px);
      bottom: clamp(30px, 4vh, 48px);
      z-index: 2;
      animation: contentIn .9s var(--ease) .28s both;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .logo-hero {
      display: flex; align-items: baseline; gap: 3px;
      margin-bottom: 14px;
    }
    .logo-hero-natural {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(38px, 4.4vw, 56px);
      font-weight: 300;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.005em;
    }
    .logo-hero-natural em { font-style: italic; }
    .logo-hero-dot { color: var(--gold); }
    .logo-hero-clinic {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.05vw, 13px);
      font-weight: 500;
      letter-spacing: 0.30em;
      text-transform: lowercase;
      color: var(--gold);
      padding-bottom: 4px;
    }
    .tagline {
      font-size: 12.5px;
      line-height: 1.75;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.80);
      max-width: 42ch;
    }
    .tagline-dots {
      display: flex; gap: 7px; margin-top: 20px;
    }
    .tagline-dot {
      width: 26px; height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.22);
    }
    .tagline-dot:first-child { background: var(--gold); width: 40px; }

    /* ── Sağ panel: form ────────────────────────────────────────────── */
    .right-inner {
      width: 100%;
      max-width: 340px;
      animation: contentIn .8s var(--ease) .18s both;
    }
    .logo-mini { display: none; }   /* slab'de sol panel logoyu zaten taşıyor */

    .welcome-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .welcome-sub {
      font-size: 12.5px;
      color: var(--ink-3);
      margin-bottom: 26px;
      font-weight: 400;
    }

    .field-group { margin-bottom: 15px; }
    .field-label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 7px;
    }
    .field-box { position: relative; display: flex; align-items: center; }
    .field-icon {
      position: absolute; left: 13px;
      display: flex; align-items: center;
      color: var(--ink-3);
      pointer-events: none;
      transition: color .18s var(--ease);
    }
    .field-input {
      width: 100%;
      padding: 13px 14px 13px 38px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--g-3);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid var(--edge-soft);
      border-radius: 13px;
      outline: none;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease),
                  background .18s var(--ease);
    }
    html[data-theme="light"] .field-input { box-shadow: inset 0 1px 2px rgba(23, 43, 99, 0.05); }
    .field-input::placeholder { color: var(--ink-3); opacity: .75; }
    html[data-theme="light"] .field-box:hover .field-input { background: rgba(255, 255, 255, 0.72); }
    html[data-theme="dark"]  .field-box:hover .field-input { background: rgba(255, 255, 255, 0.13); }
    /* Odak: görünür altın halka — outline kaldırıldığı için ŞART */
    .field-input:focus {
      border-color: var(--gold-soft);
      box-shadow: 0 0 0 4px var(--gold-dim);
    }
    .field-box:focus-within .field-icon { color: var(--gold); }

    .pw-toggle {
      position: absolute; right: 8px;
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      border: none; border-radius: 9px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      transition: background .16s var(--ease), color .16s var(--ease);
    }
    .pw-toggle:hover { color: var(--ink); background: var(--gold-dim); }

    /* ── Giriş butonu ───────────────────────────────────────────────── */
    .btn-login {
      width: 100%;
      margin-top: 10px;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #2a1f10;
      background: linear-gradient(135deg, #e3caa2 0%, var(--gold) 52%, #b8955f 100%);
      border: none;
      border-radius: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px -4px rgba(201, 169, 127, 0.55),
                  inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform .18s var(--spring), box-shadow .18s var(--ease),
                  filter .18s var(--ease);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(201, 169, 127, 0.70),
                  inset 0 1px 0 rgba(255, 255, 255, 0.55);
      filter: brightness(1.04);
    }
    .btn-login:active { transform: translateY(0) scale(0.99); }
    .btn-login:disabled {
      opacity: 0.6; cursor: not-allowed;
      transform: none; filter: none;
    }
    .btn-login:focus-visible { box-shadow: 0 0 0 4px var(--gold-dim); }

    /* Alt bilgi alanı (varsa) */
    .divider-line {
      height: 1px; margin: 22px 0 16px;
      background: var(--edge-soft);
    }
    .admin-area { text-align: center; }
    .admin-label {
      font-size: 9px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-3);
      margin-bottom: 8px;
    }
    .admin-chip {
      display: inline-block;
      padding: 5px 12px; border-radius: 9999px;
      font-size: 10.5px; font-weight: 700;
      color: var(--ink-2);
      background: var(--g-3);
      border: 1px solid var(--edge-soft);
    }

    /* ── Hata uyarısı ───────────────────────────────────────────────── */
    #alertBox {
      display: none;
      margin-bottom: 16px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.30);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      animation: alertIn .3s var(--spring) both;
    }
    html[data-theme="light"] #alertBox { color: #b91c1c; }
    html[data-theme="dark"]  #alertBox { color: #fca5a5; }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Başarı bildirimi (sağ alt) ─────────────────────────────────── */
    #loginToast {
      position: fixed;
      bottom: 32px; right: 32px;
      z-index: 9999;
      width: 320px;
      padding: 20px 20px 18px;
      border-radius: 20px;
      border: 1px solid var(--edge-soft);
      background: var(--g-1);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      box-shadow: var(--sh), var(--sheen);
      display: flex; gap: 14px; align-items: flex-start;
      transform: translateX(calc(100% + 48px));
      opacity: 0;
      transition: transform 0.45s var(--ease), opacity 0.35s ease;
      pointer-events: none;
      overflow: hidden;
    }
    #loginToast.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .toast-icon-wrap {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 11px;
      background: var(--gold-dim);
      border: 1px solid var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .toast-body { min-width: 0; }
    .toast-label {
      font-size: 9px; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 4px;
    }
    .toast-name {
      font-size: 14px; font-weight: 700; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
    /* DİKKAT: JS bu çubuğa 'toast-drain' animasyonunu atıyor
       (showToast → progress.style.animation). Animasyon scaleX ile
       çalıştığı için genişlik %100 ve transform-origin sol OLMAK ZORUNDA —
       width:0 bıraksaydım çubuk hiç görünmezdi. */
    .toast-progress {
      position: absolute; left: 0; bottom: 0; height: 2px;
      width: 100%;
      transform-origin: left;
      animation: none;
      border-radius: 0 0 20px 20px;
      background: linear-gradient(90deg, var(--gold), #e3caa2);
    }
    @keyframes toast-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* ── Buton içi bekleme göstergesi ───────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(42, 31, 16, 0.3);
      border-top-color: #2a1f10;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Dar ekran: slab tek kolona iner ────────────────────────────── */
    @media (max-width: 900px) {
      body { padding: 16px; align-items: stretch; }
      .panel-left, .panel-right {
        flex: none;
        height: auto;
        border: 1px solid var(--edge-soft);
      }
      .panel-left {
        border-radius: var(--slab-r) var(--slab-r) 0 0;
        border-bottom: none;
        min-height: 230px;
      }
      .panel-right {
        border-radius: 0 0 var(--slab-r) var(--slab-r);
        border-top: none;
        padding: 32px 24px 36px;
      }
      .panel-left::after { display: none; }
      body { flex-direction: column; justify-content: center; }
      .logo-hero-natural { font-size: 40px; }
      .welcome-title { font-size: 29px; }
    }
    @media (max-width: 560px) {
      #loginToast { left: 16px; right: 16px; width: auto; bottom: 16px; }
    }

    /* ── Hareket azaltma tercihi ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001s !important;
        transition-duration: .001s !important;
      }
    }
  </style>
</head>
<body>

  <!-- ════ LEFT: Building Photo ════ -->
  <div class="panel-left">
    <img
      class="panel-left-img"
      src="loginimage.png"
      alt="Natural Clinic Istanbul"
      onerror="this.style.display='none'; document.querySelector('.panel-left-fallback').style.display='block';"
    >
    <div class="panel-left-fallback"></div>
    <div class="panel-left-overlay"></div>
    <div class="panel-left-overlay-bottom"></div>
    <div class="panel-left-content">
      <div class="logo-hero">
        <span class="logo-hero-natural"><em>natural</em><span class="logo-hero-dot">.</span></span>
        <span class="logo-hero-clinic">clinic</span>
      </div>
      <p class="tagline">Advanced Hair Transplant &amp; Aesthetic Surgery Centre<br>Istanbul, Turkey</p>
      <div class="tagline-dots">
        <div class="tagline-dot"></div>
        <div class="tagline-dot"></div>
        <div class="tagline-dot"></div>
      </div>
    </div>
  </div>

  <!-- ════ RIGHT: Login Form ════ -->
  <div class="panel-right">
    <div class="right-inner">

      <h2 class="welcome-title">Welcome back</h2>
      <p class="welcome-sub">Sign in to access your dashboard</p>

      <form id="loginForm" onsubmit="return false;">

        <!-- Alert -->
        <div id="alertBox"></div>

        <!-- Username -->
        <div class="field-group">
          <label class="field-label">Username</label>
          <div class="field-box">
            <span class="field-icon">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input type="text" id="usernameInput" class="field-input" placeholder="Username" autocomplete="username">
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="field-box">
            <span class="field-icon">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="passwordInput" class="field-input" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
            <button type="button" class="pw-toggle" id="eyeBtn" onclick="togglePassword()" tabindex="-1" title="Şifreyi göster / gizle">
              <svg id="eyeOpen" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eyeClosed" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="button" id="loginBtn" class="btn-login" onclick="handleLogin()">
          <span id="loginBtnText">Sign In</span>
        </button>

      </form>


    </div>
  </div>

  <!-- Success Toast -->
  <div id="loginToast">
    <div class="toast-icon-wrap">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#c9a97f" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <div class="toast-body">
      <div class="toast-label">Giriş Başarılı</div>
      <div class="toast-name" id="toastName">—</div>
      <div class="toast-sub">Dashboard'a yönlendiriliyorsunuz…</div>
    </div>
    <div class="toast-progress" id="toastProgress"></div>
  </div>

  <script>
    // Password toggle
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const eyeOpen   = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        input.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    }

    const alertBox    = document.getElementById('alertBox');
    const loginBtn    = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    function showAlert(message, type) {
      if (type === 'success') {
        showToast(message);
        return;
      }
      alertBox.style.display = 'block';
      alertBox.innerText = message;
    }

    function showToast(fullName) {
      const toast    = document.getElementById('loginToast');
      const nameEl   = document.getElementById('toastName');
      const progress = document.getElementById('toastProgress');
      nameEl.textContent = fullName;
      toast.classList.add('show');
      progress.style.animation = 'toast-drain 0.6s linear forwards';
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        loginBtnText.innerHTML = '<span class="spinner"></span>&nbsp;Checking...';
      } else {
        loginBtnText.innerText = 'Sign In';
      }
    }

    async function handleLogin() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!username) { showAlert('Please enter your username.', 'error'); return; }
      if (!password) { showAlert('Please enter your password.', 'error'); return; }

      setLoading(true);

      try {
        // Kimlik doğrulama artık tarayıcıda değil, sunucuda (api/login.js,
        // service_role key ile) yapılıyor — tarayıcı Users tablosuna hiç
        // dokunmuyor, Password alanı istemciye asla gönderilmiyor. Önceden
        // burada sabit kodlu bir "admin/admin123" arka kapı şifresi vardı,
        // güvenlik açığı olduğu için kaldırıldı.
        const loginResp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const loginData = await loginResp.json().catch(() => ({}));
        if (!loginResp.ok) {
          showAlert(loginData.error || 'Login failed.', 'error');
          setLoading(false); return;
        }

        const user = loginData.user;

        const _c = await fetch('/api/config').then(r => r.json());
        const SUPABASE_URL = _c.url;
        const SUPABASE_KEY = _c.key;

        let rawRole = String(user['Role'] || 'agent').toLowerCase().trim();
        let role = 'agent';
        if (rawRole.includes('super'))                                          role = 'super-admin';
        else if (rawRole.includes('admin'))                                     role = 'admin';
        else if (rawRole.includes('regional') || rawRole.includes('manager') || rawRole.includes('rm')) role = 'regional-manager';
        else if (rawRole.includes('leader') || rawRole.includes('tl'))          role = 'team-leader';

        const sessionUser = {
          fullName: user['Deal Owner Name'] || username,
          username: user['Username'] || username,
          role: role,
          team: user['Takim Adi'] || user['Role Name'] || '',
          id: user['Id'] || user['id'] || '',
          zoho_id: user['Id'] || '',
          // admin/super-admin girişlerinde api/login.js'in ürettiği imzalı
          // token — admin.html'in Users sayfası (api/admin-users.js) bunu
          // Authorization başlığında gönderir, aksi halde 401 alır.
          token: user['token'] || ''
        };

        sessionStorage.setItem('nc_current_user', JSON.stringify(sessionUser));
        showToast(sessionUser.fullName);

        try {
          // NOT: Önceden var olmayan bir "System_Logs" tablosuna yazıyordu —
          // istek sessizce 404 alıp yutulduğu için login kayıtları hiç
          // tutulmamıştı. Panellerin addLog()'unun kullandığı gerçek tablo
          // "Logs"; aynı alan şemasıyla oraya yazıyor.
          fetch(`${SUPABASE_URL}/rest/v1/Logs`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json; charset=utf-8', 'Prefer': 'return=minimal' },
            body: JSON.stringify({ username: sessionUser.username, full_name: sessionUser.fullName || sessionUser.username, role: sessionUser.role, team: sessionUser.team, page: 'login', action_type: 'LOGIN', details: `${sessionUser.fullName} logged in` })
          }).catch(() => {});
        } catch(e) {}

        setTimeout(() => {
          // Login sonrası doğrudan panele değil, uygulama seçim ekranına
          // (apps.html) gidiyor — kullanıcı orada Natural Clinic'e ait
          // hangi sisteme gireceğini seçiyor.
          if (['agent','team-leader','admin','super-admin','regional-manager'].includes(role)) window.location.href = 'apps.html';
          else showAlert(`Role "${role}" is not authorized.`, 'error');
        }, 600);

      } catch (err) {
        console.error('Login error:', err);
        showAlert('Connection error: ' + (err.message || 'Unknown error'), 'error');
        setLoading(false);
      }
    }

    // Aynı sekmede zaten giriş yapılmış mı? (sessionStorage sekmeye özel —
    // yeni sekme/gizli sekmede boş gelir, her zaman login ister)
    try {
      const existing = JSON.parse(sessionStorage.getItem('nc_current_user') || 'null');
      if (existing && existing.role) {
        window.location.href = 'apps.html';
      }
    } catch(e) { sessionStorage.removeItem('nc_current_user'); }

    // Eski/geçersiz token yüzünden bir sayfa oturumu otomatik sonlandırıp
    // buraya geri gönderdiyse, kullanıcıya nedenini açıkla.
    if (new URLSearchParams(window.location.search).get('relogin') === '1') {
      showAlert('Your session has expired. Please sign in again.', 'error');
    }
  </script>
</body>
</html>
